[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:PyPDF2
    ignore::DeprecationWarning:starlette.*
# No markers are declared because none are used. --strict-markers makes that
# a fact rather than an assumption: a marker added later without being
# declared here is an error, not a silent typo that deselects nothing.
#
# There is deliberately no `addopts = -m "not ..."` line. It used to carry
# "not requires_local_registry and not mlflow and not manual_script", which
# deselected six tests on every run -- invisibly, because deselected tests
# are not reported as skips. A suite that hides what it did not run is a
# suite whose green means less than it appears to.
#
# -rs names every skip in the summary, so no skip can be introduced without
# showing up in the log.
addopts = --strict-markers -rs
