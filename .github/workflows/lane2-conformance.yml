name: Lane 2 conformance (report-only)

# REPORT-ONLY. This workflow measures the store against the block contract
# (KERNEL_DEFAULTS 1.3/1.4/1.6 and K2/K3) and writes a table into the run
# summary. It
# never fails a build: the checks cover code written long before the contract
# existed, and turning them red today would block the critical path to report
# a backlog everybody already knows about.
#
# The flip to enforcing is a SEPARATE workflow change, after P7 is DONE, with
# the owner's tick. Until then this is reporting, not a gate.
#
# Unlike ci.yml this runs on pull requests to ANY base branch, so a stacked
# Lane 2 PR still produces its table.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lane2-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Store-wide conformance table
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENV: test
      CEREBRUM_VIRGIN: "false"
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      VECTOR_DIMENSION: "384"
    steps:
      - uses: actions/checkout@v4

      # Same system packages as the backend job: a block that cannot import
      # its OCR/PDF/MIME dependency would otherwise be reported as a defect
      # when the only thing missing is a shared library.
      - name: Install system deps for OCR/PDF/MIME blocks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr poppler-utils libgl1 libglib2.0-0 libmagic1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # torch arrives unpinned via sentence-transformers and now resolves with
      # the CUDA 13 wheel set (cublas 423 MB, triton 248 MB, ...); with the pip
      # cache restored onto the same disk the runner hits ENOSPC before any
      # test runs. Remove preinstalled SDKs this job never uses (~20 GB).
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Store-wide conformance report
        # No `continue-on-error` needed: the script returns 0 by construction.
        # It is asserted by tests/core/test_lane2_conformance.py, so the
        # report-only promise cannot be quietly revoked by editing the script.
        run: |
          python scripts/lane2_conformance.py \
            --timeout 20 \
            --json lane2-conformance.json \
            --baseline lane2-baseline.md

      - name: Upload the raw rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane2-conformance
          path: |
            lane2-conformance.json
            lane2-baseline.md
          if-no-files-found: warn
